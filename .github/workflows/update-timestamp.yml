name: Auto Sync Timestamp to Google Sheets

on:
  push:
    branches:
      - main

jobs:
  sync-sheets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Send Timestamps to Google Sheets
        run: |
          node -e '
            const path = require("path");
            const { execSync } = require("child_process");

            let changedFiles = [];
            try {
              changedFiles = execSync("git diff-tree --no-commit-id --name-only -r HEAD").toString().trim().split("\n");
            } catch (e) {
              changedFiles = execSync("git ls-files --modified --others").toString().trim().split("\n");
            }

            if (!changedFiles.length || (changedFiles.length === 1 && changedFiles[0] === "")) {
              process.exit(0);
            }

            const now = new Date();
            now.setHours(now.getHours() + 7);
            const pad = (n) => String(n).padStart(2, "0");
            const featureTimeStr = `${pad(now.getDate())}${pad(now.getMonth() + 1)}${now.getFullYear()}${pad(now.getHours())}${pad(now.getMinutes())}`;

            const bundleMapping = {
              "Waypoint": ["SCP", "CPN"],
              "Interactable": ["ITP", "PPESP", "CDESP", "ITESP", "DESP", "TESP", "LOOT"],
              "LastRejoin": ["AutoSave", "SaveServer", "LastRejoin"],
              "MusicTimeML": ["PlayMusic"],
              "SimpleAimbot": ["Aimbot", "SetRadius"],
              "SoundandView": ["Spectator", "MuteSound"],
              "colorESP": ["PESP", "EESP"],
              "AntiEffect": ["Anchor", "AntiWind", "AntiShake", "AntiTrigger"],
              "PlayerTeleport": ["PlayerTeleport"],
              "TPitem": ["TPitem"],
              "clickinspector": ["Clickinspector"],
              "AntiAFK": ["AntiAFK"],
              "SmartRejoin": ["SmartRejoin"],
              "F1Lock": ["F1Lock"],
              "Fullbright": ["Fullbright"],
              "InstanPrompt": ["InstantPrompts"],
              "WalkSpeed": ["WalkSpeed"],
              "InfiniteJump": ["InfiniteJump"],
              "AdminDetect": ["AdminDetect"],
              "Noclip": ["Noclip"],
              "CodeFinder": ["CodeFinder"]
            };

            const SHEET_URL = "https://script.google.com/macros/s/AKfycbxJzU3MiL_o9PjkF4h-prSw-P8vLVfJqGFXM7pFJOPzIzJXaGmu6z6oK0oJl54a6bQy0Q/exec";

            changedFiles.forEach((file) => {
              if (file && (file.endsWith(".lua") || !file.includes("."))) {
                const fileName = path.basename(file).replace(/\.[^/.]+$/, "");
                let keysToUpdate = bundleMapping[fileName] || [fileName];

                keysToUpdate.forEach((keyName) => {
                  const payload = JSON.stringify({ Type: "FeatureUpdate", Key: keyName, Timestamp: featureTimeStr });
                  execSync(`curl -X POST -H "Content-Type: application/json" -d '\''${payload}'\'' "${SHEET_URL}"`);
                });
              }
            });
          '
          
