name: Auto Update Hub Metadata & Timestamps

on:
  push:
    branches:
      - main

jobs:
  update-metadata-and-sheets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Process Timestamp Updates in Loader.lua
        run: |
          node -e '
            const path = require("path");
            const fs = require("fs");
            const { execSync } = require("child_process");

            let changedFiles = [];
            try {
              changedFiles = execSync("git diff-tree --no-commit-id --name-only -r HEAD")
                .toString()
                .trim()
                .split("\n");
            } catch (e) {
              changedFiles = execSync("git ls-files --modified --others")
                .toString()
                .trim()
                .split("\n");
            }

            console.log("File terdeteksi berubah:", changedFiles);

            if (!changedFiles.length || (changedFiles.length === 1 && changedFiles[0] === "")) {
              console.log("Tidak ada perubahan file.");
              process.exit(0);
            }

            // Format Waktu WIB (UTC+7)
            const now = new Date();
            now.setHours(now.getHours() + 7);
            const pad = (n) => String(n).padStart(2, "0");
            const dd = pad(now.getDate());
            const mm = pad(now.getMonth() + 1);
            const yyyy = now.getFullYear();
            const hh = pad(now.getHours());
            const min = pad(now.getMinutes());
            const featureTimeStr = `${dd}${mm}${yyyy}${hh}${min}, 86400`;

            let loaderContent = fs.readFileSync("Loader.lua", "utf8");
            let modified = false;

            const bundleMapping = {
              "Interactable": ["ITP", "PPESP", "CDESP", "ITESP", "DESP", "TESP"],
              "LastRejoin": ["AutoSave", "SaveServer", "LastRejoin"],
              "MusicTimeML": ["PlayMusic"],
              "SimpleAimbot": ["Aimbot", "SetRadius"],
              "SoundandView": ["Spectator", "MuteSound"],
              "Waypoint": ["SCP", "CPN"],
              "colorESP": ["PESP", "EESP"],
              "AntiEffect": ["Anchor", "AntiWind", "AntiShake", "AntiTrigger"],
              "PlayerTeleport": ["PlayerTeleport"],
              "TPitem": ["TPitem"],
              "clickinspector": ["Clickinspector"],
              "AntiAFK": ["AntiAFK"],
              "SmartRejoin": ["SmartRejoin"],
              "F1Lock": ["F1Lock"],
              "Fullbright": ["Fullbright"],
              "InstanPrompt": ["InstantPrompts"],
              "WalkSpeed": ["WalkSpeed"],
              "InfiniteJump": ["InfiniteJump"],
              "AdminDetect": ["AdminDetect"],
              "Noclip": ["Noclip"],
              "CodeFinder": ["CodeFinder"]
            };

            changedFiles.forEach((file) => {
              if (file && (file.endsWith(".lua") || !file.includes("ļ"))) {
                const baseName = path.basename(file);
                const fileName = baseName.replace(/\.[^/.]+$/, "");
                
                let keysToUpdate = [fileName]; 
                if (bundleMapping[fileName]) {
                  keysToUpdate = bundleMapping[fileName];
                }

                keysToUpdate.forEach((keyName) => {
                  // Cara Super Aman: Cari baris RawUrl yang mengandung nama file ini, 
                  // lalu update UpdateTimestamp yang ada di sekitar blok tersebut.
                  console.log(`Memproses update untuk key: ${keyName} (dari file ${fileName})`);
                });

                // Kita cari berdasarkan URL RawUrl yang merujuk ke fileName tersebut di Loader.lua
                // Ubah file content dengan memecah baris-baris kodenya
                let lines = loaderContent.split("\n");
                let targetFileMatched = false;

                for (let i = 0; i < lines.length; i++) {
                  if (lines[i].includes(`Plugin/${fileName}`) || lines[i].includes(`Tools/${fileName}`)) {
                    targetFileMatched = true;
                    // Mundur ke atas untuk cari baris UpdateTimestamp terdekat milik item ini
                    for (let j = i; j >= Math.max(0, i - 15); j--) {
                      if (lines[j].includes("UpdateTimestamp =")) {
                        lines[j] = lines[j].replace(/UpdateTimestamp\s*=\s*"[^"]*"/, `UpdateTimestamp = "${featureTimeStr}"`);
                        modified = true;
                        console.log(`Berhasil menyuntikkan timestamp di baris ${j + 1}`);
                        break;
                      }
                    }
                  }
                }
                loaderContent = lines.join("\n");
              }
            });

            if (modified) {
              fs.writeFileSync("Loader.lua", loaderContent);
              console.log("Loader.lua berhasil diperbarui otomatis!");
            } else {
              console.log("Peringatan: Gagal menemukan baris RawUrl yang cocok di Loader.lua.");
            }
          '

      - name: Commit & Push Loader Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Loader.lua
          git diff --quiet && git diff --staged --quiet || (git commit -m "bot: auto update bundled feature timestamps" && git push)

      - name: Send Timestamp to Google Sheets
        run: |
          CURRENT_TIME=$(TZ='Asia/Jakarta' date +'%d%m%Y %H:%M')
          curl -X POST -H "Content-Type: application/json" \
          -d "{\"Type\":\"LastUpdate\",\"Timestamp\":\"$CURRENT_TIME\"}" \
          "https://script.google.com/macros/s/AKfycbxJzU3MiL_o9PjkF4h-prSw-P8vLVfJqGFXM7pFJOPzIzJXaGmu6z6oK0oJl54a6bQy0Q/exec"
          
